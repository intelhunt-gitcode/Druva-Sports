# ---------------------------------------------------------------------------
# Nginx location block for serving the Druva app under a sub-path on the
# demos.intelhunt.com vhost (CloudPanel → Sites → demos.intelhunt.com →
# Vhost). Add these blocks inside the existing `server { ... }` for the site,
# then reload Nginx / save the vhost in CloudPanel.
#
# The app (server.mjs) listens on 127.0.0.1:3919 and already understands the
# /druva-sports base, so we pass the path through WITHOUT stripping it.
# ---------------------------------------------------------------------------

# Redirect the bare path to the trailing-slash form.
location = /druva-sports {
    return 301 /druva-sports/;
}

location /druva-sports/ {
    proxy_pass http://127.0.0.1:3919;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}
