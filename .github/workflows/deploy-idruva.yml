name: Build & Deploy — idruva.intelhunt.com

# Deploys the same app to its own subdomain (root path, not /druva-sports)
# on every push to main. Runs alongside deploy.yml as a separate target.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-druva-idruva
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (root path)
        run: npm run build
        env:
          BASE_PATH: /
          VITE_SITE_URL: https://idruva.intelhunt.com

      - name: Assemble deploy bundle
        run: |
          rm -rf deploy
          mkdir -p deploy
          cp -r dist deploy/dist
          cp server.mjs deploy/
          cp ecosystem.idruva.config.cjs deploy/ecosystem.config.cjs
          cp deploy-package.json deploy/package.json

      - name: Upload to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.IDRUVA_SSH_HOST }}
          username: ${{ secrets.IDRUVA_SSH_USER }}
          password: ${{ secrets.IDRUVA_SSH_PASSWORD }}
          port: ${{ secrets.IDRUVA_SSH_PORT }}
          source: "deploy/*"
          target: ${{ secrets.IDRUVA_APP_DIR }}
          strip_components: 1
          overwrite: true
          rm: false

      - name: Restart app (PM2)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.IDRUVA_SSH_HOST }}
          username: ${{ secrets.IDRUVA_SSH_USER }}
          password: ${{ secrets.IDRUVA_SSH_PASSWORD }}
          port: ${{ secrets.IDRUVA_SSH_PORT }}
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            command -v node || { echo "node not found on PATH"; exit 1; }
            command -v pm2 >/dev/null 2>&1 || npm install -g pm2
            cd "${{ secrets.IDRUVA_APP_DIR }}"
            pm2 startOrReload ecosystem.config.cjs --update-env
            pm2 save
            sleep 2
            curl -fsS "http://127.0.0.1:3901/healthz" && echo " — app is up"
